name: Test & Build

# Push / PR: run the tests on all 3 operating systems, plus integration tests on a real PostgreSQL.
# Push a v* tag (e.g. v1.0.0): test, package the app for all 3 and publish a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -v

  integration:
    # Real PostgreSQL 14 (matches the runner's preinstalled client tools).
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ODT_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pg_dump --version
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -m integration -v

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, integration]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install ".[build]"
      - run: python scripts/build.py
      - name: Smoke test the built app (--version, askpass mode)
        shell: bash
        timeout-minutes: 5
        run: |
          case "$RUNNER_OS" in
            Windows) app=dist/OdooDatabaseTool.exe ;;
            macOS)   app=dist/OdooDatabaseTool.app/Contents/MacOS/OdooDatabaseTool ;;
            *)       app=dist/OdooDatabaseTool/OdooDatabaseTool ;;
          esac
          "$app" --version
          # Askpass mode with an unknown key must exit 1 quietly (no traceback, no GUI).
          set +e
          ODT_ASKPASS_KEY=missing:ssh_password "$app" > askpass.out 2>&1
          rc=$?
          set -e
          cat askpass.out
          if [ "$rc" -ne 1 ]; then echo "askpass mode exited with $rc, expected 1"; exit 1; fi
          if grep -qi traceback askpass.out; then echo "askpass mode printed a traceback"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: OdooDatabaseTool-${{ runner.os }}
          path: |
            dist/OdooDatabaseTool-*.zip
            dist/OdooDatabaseTool-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
